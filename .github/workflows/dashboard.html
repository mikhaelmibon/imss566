<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMS566 - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light" class="app">
  <div id="nav-placeholder"></div>

  <div class="content">
    <header class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-0">Dashboard</h1>
        <small class="text-muted">Welcome back, <span id="display-name">User</span></small>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm">🌙</button>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">Account</button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="users.html">Profile</a></li>
            <li><a class="dropdown-item" id="logoutBtn" href="#">Logout</a></li>
          </ul>
        </div>
      </div>
    </header>

    <section class="cards-grid mb-4">
      <div class="stat-card">
        <div class="stat-title">Total Users</div>
        <div class="stat-value" id="stat-users">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Active Tasks</div>
        <div class="stat-value">47</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Reports</div>
        <div class="stat-value">14</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Completed</div>
        <div class="stat-value">832</div>
      </div>
    </section>

    <section class="row g-4">
      <div class="col-lg-8">
        <div class="card p-3">
          <h5>User Statistics</h5>
          <canvas id="lineChart" style="height:260px"></canvas>
        </div>

        <div class="card mt-4 p-3">
          <h5 class="mb-3">User List (Quick)</h5>
          <div id="mini-table"></div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card p-3 mb-3">
          <h5>Recent Activity</h5>
          <ul id="activityList" class="list-unstyled mb-0"></ul>
        </div>

        <div class="card p-3">
          <h5>Data Visualisation</h5>
          <canvas id="pieChart" style="height:220px"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
