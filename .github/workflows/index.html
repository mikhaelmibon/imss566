<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMS566 - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light" class="auth-page">
  <main class="d-flex vh-100 align-items-center justify-content-center">
    <div class="card p-4 shadow-sm auth-card">
      <h3 class="mb-3 text-center">IMS566 - Login</h3>
      <div id="login-error" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-2">
          <label class="form-label">Username</label>
          <input id="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <div class="mt-3 text-center">
        <a href="register.html">Create an account</a>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
