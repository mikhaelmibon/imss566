<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMS566 - Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light" class="app">
  <div id="nav-placeholder"></div>

  <div class="content">
    <header class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Users</h1>
      <div>
        <button class="btn btn-primary" id="addUserBtn">Add User</button>
      </div>
    </header>

    <div class="card p-3">
      <div class="mb-3 d-flex gap-2">
        <input id="search" class="form-control" placeholder="Search users..." oninput="renderUsers()">
      </div>
      <div id="usersTable"></div>
    </div>
  </div>

  <!-- modal -->
  <div class="modal" tabindex="-1" id="userModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm" class="p-3">
          <div class="modal-header">
            <h5 class="modal-title">Add / Edit User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="userId">
            <div class="mb-2">
              <label class="form-label">Full name</label>
              <input id="uName" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input id="uEmail" type="email" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Role</label>
              <select id="uRole" class="form-select">
                <option>Student</option>
                <option>Admin</option>
                <option>Editor</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Status</label>
              <select id="uStatus" class="form-select">
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script src="js/table.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
